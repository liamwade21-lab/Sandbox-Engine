[package]
name = "se_engine"
description = "Rust/Bevy port of SpaceEngine (Vulkan renderer)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "spaceengine-rs"
path = "src/main.rs"

[dependencies]
se_core = { path = "../se_core" }
# Bevy's default features without what the port never uses: UI, sprites, text, gizmos, picking,
# gamepads, glTF/scenes, animation and morph targets, states, input focus, Bevy's clipboard and WebGL.
# Each of those adds plugins whose systems run every frame.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "reflect_auto_register",
    "sysinfo_plugin",
    "bevy_log",
    "bevy_asset",
    "bevy_winit",
    "bevy_window",
    "custom_cursor",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_mesh",
    "bevy_material",
    "bevy_shader",
    "bevy_image",
    "bevy_color",
    "hdr",
    "png",
    "ktx2",
    "zstd_rust",
    "tonemapping_luts",
    "smaa_luts",
    "bevy_audio",
    "vorbis",
    "wav",
    # Gamepads (the Skate 3 mod: Skate 3's own controller layout).
    "bevy_gilrs",
] }
# Without its `bevy_ui` and `picking` defaults, which pull those Bevy features back in.
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts", "manage_clipboard", "open_url"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
# Rigid bodies for the sandbox mode's props (sandbox/physics.rs): its own world in a local frame on the
# planet, stepped by the port, no Bevy plugin.
rapier3d = "0.36"
# The Skate 3 physics mod (skate/): the Skate 3 Rust Engine's engine-free calculations (GPL-3.0, crates/skate-core).
skate-core = { workspace = true }

# The first-run ownership check's dialogs and registry reads (ownership.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

# The Skate 3 mod's converter (skate/convert.rs, an ignored test): the Skate 3 Rust Engine's readers of its converted data.
[dev-dependencies]
skate-data = { workspace = true }
serde_json = { workspace = true }
