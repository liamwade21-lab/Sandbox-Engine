[workspace]
resolver = "3"
members = ["crates/se_core", "crates/se_engine", "crates/skate-core", "crates/skate-data", "crates/skate-dynamics", "crates/skate-net", "crates/skate-mods", "crates/skate-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
glam = "0.33"
# The Skate 3 Rust Engine's crates (crates/skate-core, crates/skate-data: GPL-3.0, copied unchanged; their UPSTREAM.md).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The Bevy the skater simulation (crates/skate-sim) needs: no default features, only what it names.
bevy = { version = "0.20", default-features = false, features = ["std", "bevy_log"] }
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }
skate-dynamics = { path = "crates/skate-dynamics" }
skate-net = { path = "crates/skate-net" }
skate-mods = { path = "crates/skate-mods" }

# Bevy recommends optimizing dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Release optimisation without LTO, built in parallel and incrementally: for the quick rebuilds of
# feature work (`cargo build --profile agent`); `release` stays the build that is played.
[profile.agent]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
