[workspace]
resolver = "3"
members = ["crates/se_core", "crates/se_engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
glam = "0.33"

# Bevy recommends optimizing dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Release optimisation without LTO, built in parallel and incrementally: for the quick rebuilds of
# feature work (`cargo build --profile agent`); `release` stays the build that is played.
[profile.agent]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
